name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    if: github.head_ref != 'feature/complaints-returns-final-regression' && github.head_ref != 'feature/pnt-p1a-master'
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: covex_quality
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d covex_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/covex_quality?schema=public
      APP_ENV: test
      DEFAULT_ACTOR_NAME: Usuario CI
      ALLOW_DEMO_DATA: "true"

    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Database smoke test
        run: |
          pnpm db:generate
          pnpm db:deploy
          pnpm db:seed
          pnpm db:smoke
          pnpm import:smoke
          pnpm indicators:smoke
          pnpm capa:import:smoke
          pnpm capa:smoke
          pnpm versions:smoke
          pnpm changes:smoke
          pnpm hito8:smoke
          pnpm hito9:smoke
          pnpm demo:seed
          pnpm create-save:smoke
          pnpm relations:smoke
          pnpm b2-3:smoke
          pnpm b3-3:smoke
          pnpm b4-3:smoke
          pnpm c3:smoke
          pnpm d3:smoke
          pnpm d6:smoke
          pnpm d5-3:smoke
          pnpm d5-6:smoke
          pnpm r1-capa:smoke
          pnpm r2b-documents:smoke
          pnpm r3-capa:smoke
          pnpm r3-complaints:smoke
          pnpm complaints-r4a:smoke
          pnpm r2-returns-documents:smoke
          pnpm r3-returns:smoke
          pnpm returns-r4b:smoke
          pnpm review-r1:smoke
          pnpm review-r2a:smoke
          pnpm review-r2b1:smoke
          pnpm review-r2b2:smoke
          pnpm review-r2b3:smoke
          pnpm audits-r3a:smoke
          pnpm audits-r3b:smoke
          pnpm audits-r3c:smoke
          pnpm review-r2c:smoke
          pnpm hito10:smoke
      - name: Quality checks
        run: pnpm quality
      - name: R2C browser regression
        run: |
          pnpm exec playwright install --with-deps chromium
          TZ=UTC pnpm start --port 3000 > /tmp/covex-r2c-next.log 2>&1 &
          review_server_pid=$!
          trap 'review_exit_code=$?; if [ "$review_exit_code" -ne 0 ]; then tail -n 100 /tmp/covex-r2c-next.log; fi; kill "$review_server_pid" 2>/dev/null || true' EXIT
          R2C_UI_BASE_URL=http://127.0.0.1:3000 pnpm review-r2c:ui:smoke
          for audit_ui_run in 1 2 3; do
            R3A_UI_BASE_URL=http://127.0.0.1:3000 pnpm audits-r3a:ui:smoke
          done
          R3B_UI_BASE_URL=http://127.0.0.1:3000 pnpm audits-r3b:ui:smoke
          R4A_UI_BASE_URL=http://127.0.0.1:3000 pnpm complaints-r4a:ui:smoke
          R4B_UI_BASE_URL=http://127.0.0.1:3000 pnpm returns-r4b:ui:smoke
          R3C_UI_BASE_URL=http://127.0.0.1:3000 pnpm audits-r3c:ui:smoke

  complaints-returns-final:
    if: github.head_ref == 'feature/complaints-returns-final-regression'
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: covex_quality
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d covex_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/covex_quality?schema=public
      APP_ENV: test
      DEFAULT_ACTOR_NAME: Usuario CI
      ALLOW_DEMO_DATA: "true"

    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: R4C PostgreSQL regression
        run: |
          pnpm db:generate
          pnpm db:deploy
          pnpm db:seed
          pnpm complaints-r4a:smoke
          pnpm returns-r4b:smoke
          pnpm hito8:smoke
          pnpm complaints-returns-r4c:smoke
      - name: R4A and R4B joint browser regression
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm build
          TZ=UTC pnpm start --port 3000 > /tmp/covex-r4c-next.log 2>&1 &
          r4c_server_pid=$!
          trap 'r4c_exit_code=$?; if [ "$r4c_exit_code" -ne 0 ]; then tail -n 100 /tmp/covex-r4c-next.log; fi; kill "$r4c_server_pid" 2>/dev/null || true' EXIT
          R4C_UI_BASE_URL=http://127.0.0.1:3000 pnpm complaints-returns-r4c:smoke
          R4A_UI_BASE_URL=http://127.0.0.1:3000 pnpm complaints-r4a:ui:smoke
          R4B_UI_BASE_URL=http://127.0.0.1:3000 pnpm returns-r4b:ui:smoke
      - name: Final quality checks
        run: |
          # The prior Next build rewrites this generated file; lint the tracked source.
          git restore next-env.d.ts
          pnpm quality

  pnt-p1a:
    if: github.head_ref == 'feature/pnt-p1a-master'
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: covex_quality
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d covex_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/covex_quality?schema=public
      APP_ENV: test
      DEFAULT_ACTOR_NAME: Usuario CI
      ALLOW_DEMO_DATA: "true"

    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: P1A PostgreSQL smoke
        run: |
          pnpm db:generate
          pnpm db:deploy
          pnpm db:seed
          pnpm pnt-p1a:smoke
      - name: P1A browser smoke
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm build
          pnpm start --port 3000 > /tmp/covex-p1a-next.log 2>&1 &
          pnt_server_pid=$!
          trap 'pnt_exit_code=$?; if [ "$pnt_exit_code" -ne 0 ]; then tail -n 100 /tmp/covex-p1a-next.log; fi; kill "$pnt_server_pid" 2>/dev/null || true' EXIT
          P1A_UI_BASE_URL=http://127.0.0.1:3000 pnpm pnt-p1a:ui:smoke
      - name: Final quality checks
        run: |
          git restore next-env.d.ts
          pnpm quality
