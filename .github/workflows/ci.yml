name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: covex_quality
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d covex_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/covex_quality?schema=public
      APP_ENV: test
      DEFAULT_ACTOR_NAME: Usuario CI
      ALLOW_DEMO_DATA: "true"

    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Database smoke test
        run: |
          pnpm db:deploy
          pnpm db:seed
          pnpm db:smoke
          pnpm import:smoke
          pnpm indicators:smoke
          pnpm capa:import:smoke
          pnpm capa:smoke
          pnpm versions:smoke
          pnpm changes:smoke
          pnpm hito8:smoke
          pnpm hito9:smoke
          pnpm demo:seed
          pnpm create-save:smoke
          pnpm relations:smoke
          pnpm b2-3:smoke
          pnpm b3-3:smoke
          pnpm b4-3:smoke
          pnpm c3:smoke
          pnpm d3:smoke
          pnpm d6:smoke
          pnpm d5-3:smoke
          pnpm d5-6:smoke
          pnpm r1-capa:smoke
          pnpm r2b-documents:smoke
          pnpm r3-capa:smoke
          pnpm r3-complaints:smoke
          pnpm r2-returns-documents:smoke
          pnpm r3-returns:smoke
          pnpm review-r1:smoke
          pnpm review-r2a:smoke
          pnpm review-r2b1:smoke
          pnpm review-r2b2:smoke
          pnpm review-r2b3:smoke
          pnpm audits-r3a:smoke
          pnpm review-r2c:smoke
          pnpm hito10:smoke
      - name: Quality checks
        run: pnpm quality
      - name: R2C browser regression
        run: |
          pnpm exec playwright install --with-deps chromium
          TZ=UTC pnpm start --port 3000 > /tmp/covex-r2c-next.log 2>&1 &
          review_server_pid=$!
          trap 'kill "$review_server_pid" 2>/dev/null || true' EXIT
          R2C_UI_BASE_URL=http://127.0.0.1:3000 pnpm review-r2c:ui:smoke
          R3A_UI_BASE_URL=http://127.0.0.1:3000 pnpm audits-r3a:ui:smoke
