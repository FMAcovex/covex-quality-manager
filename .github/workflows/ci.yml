name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: covex_quality
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d covex_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/covex_quality?schema=public
      APP_ENV: test
      DEFAULT_ACTOR_NAME: Usuario CI
      ALLOW_DEMO_DATA: "true"

    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Database smoke test
        run: |
          pnpm db:push
          pnpm db:seed
          pnpm db:smoke
          pnpm import:smoke
          pnpm indicators:smoke
          pnpm capa:import:smoke
          pnpm capa:smoke
          pnpm versions:smoke
          pnpm changes:smoke
          pnpm hito8:smoke
          pnpm hito9:smoke
          pnpm demo:seed
          pnpm create-save:smoke
          pnpm relations:smoke
          pnpm b2-3:smoke
          pnpm b3-3:smoke
          pnpm b4-3:smoke
          pnpm c3:smoke
          pnpm hito10:smoke
      - name: Quality checks
        run: pnpm quality
