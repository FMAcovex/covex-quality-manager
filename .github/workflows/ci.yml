name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TESTED_SHA: ${{ github.event.pull_request.head.sha }}
  APP_ENV: test
  DEFAULT_ACTOR_NAME: Usuario CI
  ALLOW_DEMO_DATA: "true"
  PHASE3B1_SYNTHETIC_DATABASE: "1"
  PHASE3B2_SYNTHETIC_DATABASE: "1"
  PHASE3B3_SYNTHETIC_DATABASE: "1"
  PHASE3B2_OUTPUT: ci-evidence/phase3b2
jobs:
  scope:
    runs-on: ubuntu-22.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Test CI contracts
        run: python3 .github/scripts/test_ci_contract.py
      - id: scope
        name: Classify changed paths
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/controlled_document_scope.py
  quality:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/covex_quality?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma validate and generate
        run: pnpm db:validate && pnpm db:generate
      - name: Full Vitest
        run: pnpm test
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
      # Next 15's build runs ESLint and TypeScript as mandatory gates; neither is disabled.
      - name: ESLint TypeScript and Next build
        run: pnpm build
      - name: Package build and SHA evidence
        run: |
          tar --exclude=.next/cache -cf next-build.tar .next
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          sha=os.environ["TESTED_SHA"]
          digest=hashlib.sha256(pathlib.Path("next-build.tar").read_bytes()).hexdigest()
          pathlib.Path("build-manifest.json").write_text(json.dumps({"sha":sha,"sha256":digest}))
          pathlib.Path("ci-evidence").mkdir(exist_ok=True)
          pathlib.Path("ci-evidence/quality.json").write_text(json.dumps({"group":"quality","sha":sha,"status":"success"}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.event.pull_request.head.sha }}
          path: |
            next-build.tar
            build-manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ci-results-quality
          path: ci-evidence/quality.json
          if-no-files-found: error
  regression:
    needs: [scope, quality]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [postgresql, browser-qms, browser-audits, records-r4c, pnt]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: covex_quality
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d covex_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/covex_quality?schema=public
      PNT_DOCUMENT_ACCESS_MODE: demo
      PNT_LIFECYCLE_TEST_PERMISSIONS: verify,record-approval,accept-approval,activate,retire,correct,legacy-register,manage-state
      PNT_DOCUMENT_ALLOWED_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate runner-local Prisma client
        run: pnpm db:generate
      - uses: actions/download-artifact@v4
        if: matrix.group != 'postgresql'
        with:
          name: next-build-${{ github.event.pull_request.head.sha }}
      - name: Extract verified build
        if: matrix.group != 'postgresql'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          m=json.loads(pathlib.Path("build-manifest.json").read_text())
          assert m["sha"]==os.environ["TESTED_SHA"]
          assert m["sha256"]==hashlib.sha256(pathlib.Path("next-build.tar").read_bytes()).hexdigest()
          PY
          tar -xf next-build.tar
      - uses: actions/cache@v4
        if: matrix.group != 'postgresql'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Chromium and system dependencies
        if: matrix.group != 'postgresql'
        run: pnpm exec playwright install --with-deps chromium
      - name: Isolated regression suites
        run: python3 .github/scripts/run_ci_group.py ${{ matrix.group }}
      - name: Preserve suite results logs and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-${{ matrix.group }}
          path: ci-evidence/
          if-no-files-found: error
  final-gate:
    name: QMS final gate
    needs: [scope, quality, regression]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.docs_only != 'true'
        with:
          pattern: ci-results-*
          path: ci-evidence
          merge-multiple: true
      - name: Enforce complete same-SHA coverage
        if: always()
        env:
          CLASSIFIED_SHA: ${{ needs.scope.outputs.head_sha }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qms-final-gate
          path: gate-result.json
          if-no-files-found: error
